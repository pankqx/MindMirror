<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f0" />
    <meta name="description" content="MindMirror: notice early signs of stress against your own normal, and find the right support." />
    <script>
      // set the theme before first paint, so there is no flash
      try {
        var p = JSON.parse(localStorage.getItem("mindmirror.prefs") || "{}");
        var t = p.theme && p.theme !== "system" ? p.theme : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>MindMirror</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
